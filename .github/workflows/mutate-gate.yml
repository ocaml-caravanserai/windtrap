name: Mutation gate

# Gate 1 of the mutation plan: a full @self-mutate stays within the bounds
# of dev/gate/bounds. A pull request that changes the gate runs it too.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/mutate-gate.yml
      - dev/gate/**

jobs:
  self-mutate:
    runs-on: ubuntu-latest
    # The limit of GitHub. It leaves 30 minutes over the time bound of
    # dev/gate/bounds for the set-up.
    timeout-minutes: 360

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test

      - name: Mutation gate
        run: opam exec -- sh dev/gate/self-mutate.sh
